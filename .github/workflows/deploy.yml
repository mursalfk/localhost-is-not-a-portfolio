# .github/workflows/deploy.yml
# Push to main -> this builds and deploys. No keys stored anywhere.
#
# It stays idle (skipped, not failed) until AWS_ROLE_ARN is set, so a fresh fork shows no red cross.
# It builds the app in demo-app/. If your project is at the repo root, change the two lines marked ROOT.
#
# Before it works, do these three things once:
#   1. Add GitHub as an OIDC provider in IAM (Identity providers -> Add provider ->
#      OpenID Connect -> https://token.actions.githubusercontent.com, audience sts.amazonaws.com)
#   2. Create a role using policies/github-oidc-trust.json as its trust policy,
#      and policies/deploy-permissions.json as its permission policy.
#   3. Set these repo variables (Settings -> Secrets and variables -> Actions -> Variables):
#         AWS_ROLE_ARN      arn:aws:iam::123456789012:role/github-deploy
#         AWS_REGION        ap-south-1
#         S3_BUCKET         your-unique-site-name
#         CLOUDFRONT_ID     EXXXXXXXXXXXXX     (optional)

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write      # required for OIDC. Forgetting this is the #1 cause of failures.
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-app      # ROOT: use . if package.json is at the repo root
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: demo-app/package-lock.json      # ROOT: use package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Assume the AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload to S3
        run: aws s3 sync dist/ s3://${{ vars.S3_BUCKET }} --delete

      - name: Bust the CloudFront cache
        if: vars.CLOUDFRONT_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_ID }} \
            --paths "/*"

      - name: Say where it went
        run: echo "Deployed. https://${{ vars.CLOUDFRONT_ID != '' && 'your-distribution.cloudfront.net' || format('{0}.s3-website.{1}.amazonaws.com', vars.S3_BUCKET, vars.AWS_REGION) }}" >> $GITHUB_STEP_SUMMARY
